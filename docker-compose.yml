services:
  postgres:
    image: postgres:16-alpine
    container_name: idearelay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: idearelay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/django
      dockerfile: ../../infrastructure/docker/django.Dockerfile
    container_name: idearelay-backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend/django:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-development-secret-key-change-in-production
      - ALLOWED_HOSTS=*
      - DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/idearelay
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
    depends_on:
      postgres:
        condition: service_healthy

  realtime:
    build:
      context: ./backend/realtime
      dockerfile: ../../infrastructure/docker/realtime.Dockerfile
    container_name: idearelay-realtime
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - NODE_ENV=development
      - JWT_SECRET=django-insecure-development-secret-key-change-in-production
      - NEON_DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/idearelay
      - CORS_ORIGIN=http://localhost:5173,http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ./frontend/dashboard
      dockerfile: ../../infrastructure/docker/dashboard.Dockerfile
    container_name: idearelay-dashboard
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
